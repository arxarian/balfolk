<!doctype html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vizualizace tanců — balfolk</title>
  <style>
    :root {
      --bg: #FFF1E2;
      --panel: #ffffff;
      --text: #000000;
      --muted: #6b7280;
      --line: #F38508;
      --blue: #2563eb;
      --red: #dc2626;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 16px;
    }

    .wrap {
      width: min(100%, 980px);
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .panel {
      background: var(--panel);
      border: 2px solid var(--line);
      border-radius: .3rem;
      padding: 12px 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.04);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 14px 20px;
      align-items: center;
      justify-content: space-between;
    }

    .left-controls,
    .right-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      align-items: center;
    }

    label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      color: var(--text);
    }

    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    select {
      border: 1px solid var(--line);
      background: white;
      color: var(--text);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
    }

    button {
      border: 1px solid var(--line);
      background: white;
      color: var(--text);
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #f3f4f6;
    }

    button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .playback {
      display: none;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .playback.is-visible {
      display: flex;
    }

    .canvas-panel {
      padding: 10px;
    }

    canvas {
      width: 100%;
      height: auto;
      display: block;
      background: white;
      border-radius: 14px;
    }

    .note {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .note strong {
      color: var(--text);
      font-weight: 600;
    }

    .badge {
      font-size: 15px;
    }

    .section-label {
      color: var(--muted);
      font-size: 14px;
      min-height: 1.2em;
    }

    .dancer-picker {
      display: none;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .dancer-picker.is-visible {
      display: flex;
    }

    .dancer-picker-label {
      color: var(--muted);
      font-size: 13px;
      margin-right: 2px;
    }

    .dancer-picker button {
      min-width: 2.4em;
      padding: 6px 8px;
      font-size: 12px;
      font-weight: 600;
      border-color: var(--dancer-color, var(--line));
      color: var(--dancer-color, var(--text));
    }

    .dancer-picker button.is-selected {
      background: var(--dancer-color, var(--line));
      color: #fff;
      border-color: var(--dancer-color, var(--line));
    }

    .dancer-picker button.is-selected:hover {
      background: var(--dancer-color, var(--line));
      filter: brightness(0.95);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel note" id="danceNote">
      <div id="danceNoteBody"></div>
    </div>

    <div class="panel controls">
      <div class="left-controls">
        <label>
          Tanec
          <select id="danceSelect" aria-label="Výběr tance"></select>
        </label>
        <label><input type="checkbox" id="toggleBackdrop" checked> <span id="backdropLabel">Podklad</span></label>
        <label><input type="checkbox" id="toggleTrails" checked> Trajektorie</label>
        <label><input type="checkbox" id="toggleGuidePoints" checked> Průchozí body</label>
        <label><input type="checkbox" id="toggleLabels"> Čísla dob</label>
        <div class="dancer-picker" id="dancerPicker" aria-label="Výběr tanečníka">
          <span class="dancer-picker-label">Tanečník</span>
        </div>
      </div>
      <div class="right-controls">
        <div class="playback" id="playbackControls">
          <button type="button" id="btnStepBack" title="O krok zpět">◀ Zpět</button>
          <button type="button" id="btnPlayPause" title="Zastavit / přehrát">Zastavit</button>
          <button type="button" id="btnStepFwd" title="O krok vpřed">Vpřed ▶</button>
          <button type="button" id="btnSpeed" title="Rychlost přehrávání">1×</button>
        </div>
        <div class="badge">Pozice: <strong id="beatInCycle">1</strong> / <span id="beatTotal">4</span></div>
        <div class="section-label" id="sectionLabel"></div>
      </div>
    </div>

    <div class="panel canvas-panel">
      <canvas id="danceCanvas" width="900" height="900"></canvas>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('danceCanvas');
    const ctx = canvas.getContext('2d');
    const center = { x: canvas.width / 2, y: canvas.height / 2 };
    const dotRadius = 10;
    const MOVE_FRACTION = 0.5;
    /** Fraction of parent beat spent holding on each intermediate half-beat. */
    const HALF_HOLD_FRACTION = 0.12;

    const danceSelect = document.getElementById('danceSelect');
    const toggleBackdrop = document.getElementById('toggleBackdrop');
    const toggleTrails = document.getElementById('toggleTrails');
    const toggleGuidePoints = document.getElementById('toggleGuidePoints');
    const toggleLabels = document.getElementById('toggleLabels');
    const backdropLabel = document.getElementById('backdropLabel');
    const beatInCycleEl = document.getElementById('beatInCycle');
    const beatTotalEl = document.getElementById('beatTotal');
    const sectionLabelEl = document.getElementById('sectionLabel');
    const danceNoteBody = document.getElementById('danceNoteBody');
    const playbackControls = document.getElementById('playbackControls');
    const btnPlayPause = document.getElementById('btnPlayPause');
    const btnStepBack = document.getElementById('btnStepBack');
    const btnStepFwd = document.getElementById('btnStepFwd');
    const btnSpeed = document.getElementById('btnSpeed');
    const dancerPicker = document.getElementById('dancerPicker');

    const SPEED_STEPS = [1, 0.5, 0.25];
    const SPEED_LABELS = ['1×', '½×', '¼×'];
    let speedIndex = 0;

    // ——— shared helpers ———

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function patternPointAt(pattern, stepIndex, phase, destIndex) {
      const endIdx = destIndex != null ? destIndex : stepIndex + 1;
      const start = pattern[stepIndex];
      const end = pattern[endIdx];
      return [
        lerp(start[0], end[0], phase),
        lerp(start[1], end[1], phase),
      ];
    }

    function framesPoseEqual(dance, i, j) {
      return dance.dancers.every((dancer) => {
        const a = dancer.pattern[i];
        const b = dancer.pattern[j];
        return a && b && a[0] === b[0] && a[1] === b[1];
      });
    }

    /** Ordered keyframes for a dance. Each entry: { id, beat }. */
    function getTimeline(dance) {
      if (dance.timeline) {
        return dance.timeline.map(f => ({ id: f.id, beat: f.beat }));
      }
      // Default: one keyframe per integer beat 0..stepCount
      const tl = [];
      for (let i = 0; i <= dance.stepCount; i++) {
        tl.push({ id: String(dance.guideLabelsFromZero ? i : i + 1), beat: i });
      }
      if (!dance.guideLabelsFromZero) {
        for (let i = 0; i < dance.stepCount; i++) tl[i].id = String(i + 1);
        tl[dance.stepCount].id = '1';
      }
      return tl;
    }

    // When the last keyframe is not a duplicate of the first, the engine adds a
    // wrap segment last→first so playback/stepping never jump. Closing-frame
    // dances (last pose == first) keep the old model with no extra wrap.
    function getWrapBeats(dance) {
      if (dance.wrapBeats === 0) return 0;
      const n = dance.dancers[0].pattern.length;
      if (n < 2) return 0;
      if (framesPoseEqual(dance, 0, n - 1)) return 0;
      if (dance.wrapBeats != null) return dance.wrapBeats;
      // Custom timeline without a closing duplicate → wrap by default
      if (dance.timeline) return 1;
      return 0;
    }

    function getCycleBeats(dance) {
      const tl = getTimeline(dance);
      return tl[tl.length - 1].beat + getWrapBeats(dance);
    }

    function isHalfBeatFrame(frame) {
      if (!frame) return false;
      if (/[a-z]$/i.test(String(frame.id))) return true;
      return Math.abs(frame.beat - Math.round(frame.beat)) > 1e-6;
    }

    /** True when a full-beat group has intermediate half-beat waypoints. */
    function groupHasHalfBeats(group, timeline) {
      return group.waypoints.some((idx) => isHalfBeatFrame(timeline[idx]));
    }

    /** Half-beat waypoints that are not the group's destination full beat. */
    function intermediateHalfCount(group, timeline) {
      let n = 0;
      for (const idx of group.waypoints) {
        if (idx === group.bIdx) continue;
        if (isHalfBeatFrame(timeline[idx])) n++;
      }
      return n;
    }

    /**
     * Beat-time budget for actual motion inside the move window (after mid-holds).
     * Mid-holds are carved from the move window so parentDuration stays unchanged.
     */
    function groupMoveBudget(group, timeline, parentDuration) {
      const moveWindow = parentDuration * MOVE_FRACTION;
      const n = intermediateHalfCount(group, timeline);
      if (n === 0) return moveWindow;
      const holdTotal = Math.min(
        n * parentDuration * HALF_HOLD_FRACTION,
        moveWindow * 0.6
      );
      return Math.max(1e-9, moveWindow - holdTotal);
    }

    /**
     * Ordered move/hold segments covering exactly the move window.
     * Intermediate half-beats get a short hold; final pause at B is outside this.
     */
    function buildGroupSchedule(group, timeline, parentDuration) {
      const moveWindow = parentDuration * MOVE_FRACTION;
      const moveBudget = groupMoveBudget(group, timeline, parentDuration);
      const nHalf = intermediateHalfCount(group, timeline);
      const holdEach = nHalf > 0 ? (moveWindow - moveBudget) / nHalf : 0;
      const schedule = [];

      for (let i = 0; i < group.waypoints.length - 1; i++) {
        const fromIdx = group.waypoints[i];
        const toIdx = group.waypoints[i + 1];
        const bFrom = groupWaypointBeat(timeline, fromIdx, group);
        const bTo = groupWaypointBeat(timeline, toIdx, group);
        const span = Math.abs(bTo - bFrom) / parentDuration;
        schedule.push({
          kind: 'move',
          fromIdx,
          toIdx,
          durationBeats: moveBudget * span,
        });
        if (toIdx !== group.bIdx && isHalfBeatFrame(timeline[toIdx])) {
          schedule.push({
            kind: 'hold',
            fromIdx: toIdx,
            toIdx,
            durationBeats: holdEach,
          });
        }
      }
      return schedule;
    }

    function getFullBeatIndices(timeline) {
      const idxs = [];
      for (let i = 0; i < timeline.length; i++) {
        if (!isHalfBeatFrame(timeline[i])) idxs.push(i);
      }
      return idxs.length ? idxs : [0];
    }

    /** Effective beat time for a waypoint inside a full-beat group (wrap end → cycleBeats). */
    function groupWaypointBeat(timeline, idx, group) {
      if (group.wraps && idx === group.bIdx) return group.bBeat;
      return timeline[idx].beat;
    }

    /**
     * Full-beat group containing beatInCycle: from full-beat A to next full-beat B,
     * including any half-beat waypoints in between. Short holds live at mid-beats;
     * the long pause lives at B after the move window.
     */
    function findFullBeatGroup(dance, beatInCycle) {
      const timeline = getTimeline(dance);
      const cycleBeats = getCycleBeats(dance);
      const wrapBeats = getWrapBeats(dance);
      const fullIdxs = getFullBeatIndices(timeline);

      for (let g = 0; g < fullIdxs.length; g++) {
        const aIdx = fullIdxs[g];
        const isLast = g === fullIdxs.length - 1;
        const bIdx = isLast ? fullIdxs[0] : fullIdxs[g + 1];
        const aBeat = timeline[aIdx].beat;
        const wraps = isLast && wrapBeats > 0;
        const bBeat = wraps ? cycleBeats : timeline[bIdx].beat;

        const inGroup = wraps
          ? beatInCycle >= aBeat
          : (beatInCycle >= aBeat && beatInCycle < bBeat);

        if (!inGroup) continue;

        const waypoints = [];
        if (!wraps) {
          for (let i = aIdx; i <= bIdx; i++) waypoints.push(i);
        } else {
          for (let i = aIdx; i < timeline.length; i++) waypoints.push(i);
          if (waypoints[waypoints.length - 1] !== bIdx) waypoints.push(bIdx);
        }

        return { aIdx, bIdx, aBeat, bBeat, waypoints, wraps };
      }

      // Fallback: first group
      const aIdx = fullIdxs[0];
      const bIdx = fullIdxs.length > 1 ? fullIdxs[1] : aIdx;
      const waypoints = [];
      for (let i = aIdx; i <= bIdx; i++) waypoints.push(i);
      return {
        aIdx,
        bIdx,
        aBeat: timeline[aIdx].beat,
        bBeat: timeline[bIdx].beat,
        waypoints,
        wraps: false,
      };
    }

    function findGroupForSegment(dance, from, to) {
      const timeline = getTimeline(dance);
      const wrapBeats = getWrapBeats(dance);
      const cycleBeats = getCycleBeats(dance);
      const n = timeline.length;
      // Probe a beat slightly inside the segment (incl. wrap either direction).
      let probe;
      if (from === n - 1 && to === 0 && wrapBeats > 0) {
        probe = timeline[from].beat + Math.min(0.01, wrapBeats / 2);
      } else if (from === 0 && to === n - 1 && wrapBeats > 0) {
        probe = timeline[to].beat + Math.min(0.01, wrapBeats / 2);
      } else {
        const a = timeline[from].beat;
        const b = timeline[to].beat;
        probe = a + (b - a) * 0.5;
      }
      if (probe >= cycleBeats) probe = Math.max(0, cycleBeats - 1e-6);
      return findFullBeatGroup(dance, probe);
    }

    /** Move duration (in beats) for one keyframe→keyframe step inside its full-beat group. */
    function subSegmentMoveBeats(dance, from, to) {
      const timeline = getTimeline(dance);
      const group = findGroupForSegment(dance, from, to);
      const parentDuration = Math.max(1e-9, group.bBeat - group.aBeat);
      const moveBudget = groupMoveBudget(group, timeline, parentDuration);
      const bFrom = groupWaypointBeat(timeline, from, group);
      const bTo = groupWaypointBeat(timeline, to, group);
      const delta = Math.abs(bTo - bFrom);
      return Math.max(0.05, moveBudget * (delta / parentDuration));
    }

    function getStateAtTime(t, dance) {
      const beatDuration = 60 / dance.bpm;
      const timeline = getTimeline(dance);
      const cycleBeats = getCycleBeats(dance);
      const totalBeats = t / beatDuration;
      const beatInCycle = ((totalBeats % cycleBeats) + cycleBeats) % cycleBeats;
      const group = findFullBeatGroup(dance, beatInCycle);
      const parentDuration = Math.max(1e-9, group.bBeat - group.aBeat);
      const moveWindow = parentDuration * MOVE_FRACTION;
      const localInParent = beatInCycle - group.aBeat;

      // Wait on the destination full beat after the move window.
      if (localInParent >= moveWindow) {
        return {
          beatIndex: Math.floor(totalBeats),
          beatInCycle: timeline[group.bIdx].id,
          beatPhase: 1,
          stepIndex: group.waypoints[group.waypoints.length - 2] ?? group.aIdx,
          destIndex: group.bIdx,
          frameId: timeline[group.bIdx].id,
          moving: false,
          localMovePhase: 1,
          beatFloat: beatInCycle,
          segmentBeats: parentDuration,
          destIsHalf: false,
        };
      }

      // Walk move/hold schedule (mid-beat holds carved from the move window).
      const schedule = buildGroupSchedule(group, timeline, parentDuration);
      let cursor = 0;
      let seg = schedule[0];
      for (let i = 0; i < schedule.length; i++) {
        seg = schedule[i];
        const end = cursor + seg.durationBeats;
        if (localInParent < end - 1e-12 || i === schedule.length - 1) break;
        cursor = end;
      }

      const destIsHalf = isHalfBeatFrame(timeline[seg.toIdx]);
      // Half-beat groups stay linear on every leg so the second half doesn't
      // rush via easeOutCubic; ease only undivided full-beat moves.
      const useLinear = destIsHalf || groupHasHalfBeats(group, timeline);

      if (seg.kind === 'hold') {
        return {
          beatIndex: Math.floor(totalBeats),
          beatInCycle: timeline[seg.toIdx].id,
          beatPhase: 1,
          stepIndex: seg.toIdx,
          destIndex: seg.toIdx,
          frameId: timeline[seg.toIdx].id,
          moving: false,
          localMovePhase: 1,
          beatFloat: beatInCycle,
          segmentBeats: seg.durationBeats,
          destIsHalf: true,
        };
      }

      const raw = seg.durationBeats > 1e-12
        ? Math.min(1, Math.max(0, (localInParent - cursor) / seg.durationBeats))
        : 1;
      const stepIndex = seg.fromIdx;
      const destIndex = seg.toIdx;

      return {
        beatIndex: Math.floor(totalBeats),
        beatInCycle: timeline[destIndex].id,
        beatPhase: raw,
        stepIndex,
        destIndex,
        frameId: raw < 1 ? timeline[stepIndex].id : timeline[destIndex].id,
        moving: raw < 1,
        localMovePhase: useLinear ? raw : easeOutCubic(raw),
        beatFloat: beatInCycle,
        segmentBeats: seg.durationBeats,
        destIsHalf,
      };
    }

    function sectionLabelFor(dance, state) {
      if (!dance.sections) return '';
      const beat = state.beatFloat != null ? state.beatFloat : 0;
      const hit = dance.sections.find(s => beat >= s.fromBeat && beat < s.toBeat);
      return hit ? hit.label : '';
    }

    function overlayAbsoluteBeat(dance, state) {
      const beat = sectionStateFor(dance, state).beatFloat;
      return beat != null ? beat : 0;
    }

    /** Phrase window start (0, 16, 32). At exact 16/32 stay in previous window. */
    function bourreeWindowStart(beatFloat) {
      let b = ((beatFloat % BOURREE_CYCLE_END) + BOURREE_CYCLE_END) % BOURREE_CYCLE_END;
      if (b > 0 && b % BOURREE_PHRASE === 0) b -= 1e-9;
      return Math.floor(b / BOURREE_PHRASE) * BOURREE_PHRASE;
    }

    /** Absolute beat range for Trajektorie / Čísla dob: 0–16, 17–32, 33–48. */
    function bourreeOverlayRange(beatFloat) {
      const startBeat = bourreeWindowStart(beatFloat);
      return { startBeat, endBeat: startBeat + BOURREE_PHRASE };
    }

    function beatInBourreeOverlayWindow(beat, range) {
      if (range.startBeat === 0) return beat >= 0 && beat <= range.endBeat;
      return beat > range.startBeat && beat <= range.endBeat;
    }

    function danceHasDancerPicker(dance) {
      return dance.id === 'bourree_6' || dance.id === 'congo_de_captieux';
    }

    function dancersForOverlays(dance) {
      if (!danceHasDancerPicker(dance) || !selectedDancerId) return dance.dancers;
      return dance.dancers.filter((d) => d.id === selectedDancerId);
    }

    /** True when another selectable dancer is selected — this one should draw faded. */
    function dancerIsDimmed(dancer) {
      return !!(selectedDancerId && dancer.id && dancer.id !== selectedDancerId);
    }

    function rebuildDancerPickerButtons(dance) {
      dancerPicker.querySelectorAll('button[data-role]').forEach((btn) => btn.remove());
      dance.dancers
        .filter((dancer) => dancer.id)
        .forEach((dancer) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.dataset.role = dancer.id;
          btn.textContent = dancer.label;
          btn.title = 'Vybrat tanečníka ' + dancer.label;
          btn.style.setProperty('--dancer-color', dancer.color);
          btn.classList.toggle('is-selected', dancer.id === selectedDancerId);
          btn.addEventListener('click', () => {
            selectedDancerId = selectedDancerId === dancer.id ? null : dancer.id;
            syncDancerPicker(currentDance);
          });
          dancerPicker.appendChild(btn);
        });
    }

    function syncDancerPicker(dance) {
      const show = danceHasDancerPicker(dance);
      dancerPicker.classList.toggle('is-visible', show);
      if (!show) {
        selectedDancerId = null;
        dancerPicker.querySelectorAll('button[data-role]').forEach((btn) => btn.remove());
        return;
      }
      rebuildDancerPickerButtons(dance);
    }

    // ——— San Benito (polar circle) ———

    const sanBenitoBaseRadius = 270;
    const sanBenitoRadialUnit = 38;
    const sanBenitoXUnitAngle = Math.PI / 16;

    const bluePattern = [
      [0, 1],
      [2, 0],
      [2, -2],
      [2, 0],
      [4, 1],
    ];

    const redPattern = [
      [4, -2],
      [4, 0],
      [2, 1],
      [0, 0],
      [0, -2],
    ];

    const sanBenitoDancers = [];
    // Osm stejných úseků po 45°. Modrý a červený tanečník v každém
    // úseku používají stejný počátek osy x.
    for (let i = 0; i < 8; i++) {
      const baseAngle = Math.PI / 2 + i * (Math.PI / 4);
      sanBenitoDancers.push({
        color: '#2563eb',
        label: '',
        baseAngle,
        pattern: bluePattern,
      });
      sanBenitoDancers.push({
        color: '#dc2626',
        label: '',
        baseAngle,
        pattern: redPattern,
      });
    }

    function sanBenitoToCanvas(dancer, p) {
      const [x, y] = p;
      const angle = dancer.baseAngle + x * sanBenitoXUnitAngle;
      const radius = sanBenitoBaseRadius - y * sanBenitoRadialUnit;
      return {
        x: center.x + radius * Math.cos(angle),
        y: center.y - radius * Math.sin(angle),
      };
    }

    function sanBenitoBackdrop() {
      ctx.save();
      ctx.strokeStyle = '#c7cdd8';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(center.x, center.y, sanBenitoBaseRadius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // ——— Congo de Captieux (Cartesian square / quadrette) ———
    // Dance coords: x right, y up. Square half-side CONGO_S.
    // Start at the four corners; other frames stay on edges or diagonals.
    // Timeline may include half-beats (e.g. "0a" at beat 0.5).

    const CONGO_S = 2.4;
    const congoUnit = 120;

    function congoToCanvas(_dancer, p) {
      return {
        x: center.x + p[0] * congoUnit,
        y: center.y - p[1] * congoUnit,
      };
    }

    function congoBackdrop() {
      const half = CONGO_S * congoUnit;
      const left = center.x - half;
      const right = center.x + half;
      const top = center.y - half;
      const bottom = center.y + half;

      ctx.save();
      ctx.strokeStyle = '#c7cdd8';
      ctx.lineWidth = 2;

      // Square floor
      ctx.strokeRect(left, top, half * 2, half * 2);

      // Diagonals (X)
      ctx.beginPath();
      ctx.moveTo(left, top);
      ctx.lineTo(right, bottom);
      ctx.moveTo(right, top);
      ctx.lineTo(left, bottom);
      ctx.stroke();

      // Horizontal midline
      ctx.setLineDash([5, 5]);
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(left, center.y);
      ctx.lineTo(right, center.y);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.restore();
    }

    // Corners: NW=(-S,S) FN, NE=(S,S) LN, SW=(-S,-S) LS, SE=(S,-S) FS
    // One list per keyframe: id + beat + dancer positions (edit the dance here only).
    const S = CONGO_S;

    const congoFrames = [
      {
        id: '0', beat: 0,
        LN: [S, S], FN: [-S, S],
        LS: [-S, -S], FS: [S, -S],
      },
      {
        id: '1', beat: 1,
        LN: [S, S * 0.28], FN: [-S, S * 0.28],
        LS: [-S, -S * 0.28], FS: [S, -S * 0.28],
      },
      {

        LN: [S, S], FN: [-S, S],
        LS: [-S, -S], FS: [S, -S],
      },
      {

        LN: [S, S * 0.28], FN: [-S, S * 0.28],
        LS: [-S, -S * 0.28], FS: [S, -S * 0.28],
      },
      {

        LN: [0, S * 0.2], FN: [0, S * 0.4],
        LS: [0, -S * 0.2], FS: [0, -S * 0.4],

      },
      {
        id: '15a', beat: 15.5,

        LS: [0, -S * 0.4], FS: [0, -S * 0.2],
      },

    function congoPatternFor(role) {
      return congoFrames.map(frame => frame[role]);
    }

    const congoDancers = [
      { id: 'LN', color: '#2563eb', label: 'LN', pattern: congoPatternFor('LN') },
      { id: 'FN', color: '#dc2626', label: 'FN', pattern: congoPatternFor('FN') },
      { id: 'LS', color: '#2563eb', label: 'LS', pattern: congoPatternFor('LS') },
      { id: 'FS', color: '#dc2626', label: 'FS', pattern: congoPatternFor('FS') },
    ];

    // ——— Bourrée (6) — rectangle, 2×3 ———
    // Dance coords: x right, y up. Outer corners at (±BW, ±BH).
    // Part 1: shared zig-zag — bases on two facing rows, dips on dual mid-lines,
    // vertical row swap at the ends. (All six, phase-offset.)
    // Part 2: middles on cross; corners on dual-lane perimeter (outer CCW / inner CW).

    const BW = 2.5;
    const BH = 2.0;
    /** Parallel mid-lanes so bottom/top dips do not share the same spots. */
    const BMID = 0.35;
    /** Four x positions on each mid-line. */
    const BOURREE_MX = [-BW, -BW * 0.4, BW *0.4, BW];
    const bourreeUnit = 115;
    const BOURREE_ROLES = ['BL', 'BC', 'BR', 'TR', 'TC', 'TL'];
    // Phrase = Part1 (8) + Part2 (8) = 16. UI always shows x/16.
    // Absolute cycle = 3 phrases (48) so BL returns home with no teleport.
    const BOURREE_PART1_END = 8;
    const BOURREE_PART2_LEN = 8;
    const BOURREE_PHRASE = BOURREE_PART1_END + BOURREE_PART2_LEN; // 16
    const BOURREE_PHRASE_COUNT = 3;
    const BOURREE_CYCLE_END = BOURREE_PHRASE * BOURREE_PHRASE_COUNT; // 48
    /** Circuit indices that are middle-column bases (Part 2 = cross). */
    const BOURREE_MIDDLE_INDEX = { 2: true, 8: true }; // BC, TC
    /** Circuit indices that are rectangle corners (Part 2 = perimeter). */
    const BOURREE_CORNER_INDEX = { 0: true, 4: true, 6: true, 10: true }; // BL, BR, TR, TL
    /** Corner ring slots CCW: 0 BR → 1 TR → 2 TL → 3 BL. */
    const BOURREE_CORNER_RING = [4, 6, 10, 0];
    const BOURREE_CORNER_SLOT = { 4: 0, 6: 1, 10: 2, 0: 3 };
    /** Outer lane = BR/TL (CCW); inner lane = TR/BL (CW). */
    const BOURREE_CORNER_OUTER = { 4: true, 10: true };
    /** Equal distance from rectangle edge for outer and inner lane mids. */
    const BOURREE_CORNER_LANE = 0.35;

    function bourreeToCanvas(_dancer, p) {
      return {
        x: center.x + p[0] * bourreeUnit,
        y: center.y - p[1] * bourreeUnit,
      };
    }

    function bourreeBackdrop() {
      const left = center.x - BW * bourreeUnit;
      const right = center.x + BW * bourreeUnit;
      const top = center.y - BH * bourreeUnit;
      const bottom = center.y + BH * bourreeUnit;
      const midTop = center.y - BMID * bourreeUnit;
      const midBot = center.y + BMID * bourreeUnit;

      ctx.save();
      ctx.strokeStyle = '#c7cdd8';
      ctx.lineWidth = 2;
      ctx.strokeRect(left, top, right - left, bottom - top);

      ctx.setLineDash([5, 5]);
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(left, midTop);
      ctx.lineTo(right, midTop);
      ctx.moveTo(left, midBot);
      ctx.lineTo(right, midBot);
      ctx.moveTo(center.x, top);
      ctx.lineTo(center.x, bottom);
      ctx.stroke();
      ctx.setLineDash([]);

      // Marks at the 4+4 equidistant mid-line wait points.
      ctx.fillStyle = '#c7cdd8';
      for (let i = 0; i < BOURREE_MX.length; i++) {
        const x = center.x + BOURREE_MX[i] * bourreeUnit;
        ctx.beginPath();
        ctx.arc(x, midTop, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x, midBot, 4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // Path stops (12). Part 1 only walks 8 beats along this path.
    // 0 BL → 1 L1 → 2 BC → 3 L2 → 4 BR → 5 U3 → 6 TR → 7 U2 → 8 TC → 9 U1 → 10 TL → 11 L0
    const bourreeCircuit = [
      [-BW, -BH],                 // 0 BL
      [BOURREE_MX[1], -BMID],     // 1 L1
      [0, -BH],                   // 2 BC
      [BOURREE_MX[2], -BMID],     // 3 L2
      [BW, -BH],                  // 4 BR
      [BOURREE_MX[3], BMID],      // 5 U3 (right-edge mid)
      [BW, BH],                   // 6 TR
      [BOURREE_MX[2], BMID],      // 7 U2
      [0, BH],                    // 8 TC
      [BOURREE_MX[1], BMID],      // 9 U1
      [-BW, BH],                  // 10 TL
      [BOURREE_MX[0], -BMID],     // 11 L0 (left-edge mid)
    ];

    // Home-slot offsets on the circuit (BL starts bottom left).
    const bourreeCircuitOffset = {
      BL: 0, BC: 2, BR: 4, TR: 6, TC: 8, TL: 10,
    };

    function bourreeCircuitPosFrom(startIndex, step) {
      const n = bourreeCircuit.length;
      const p = bourreeCircuit[((startIndex + step) % n + n) % n];
      return p.slice();
    }

    function bourreeCircuitPos(role, step) {
      return bourreeCircuitPosFrom(bourreeCircuitOffset[role], step);
    }

    // Part 2 cross keyed by which middle Part 1 ended on (TC north / BC south).
    function bourreeCrossPos(middleIndex, local) {
      const fromNorth = middleIndex === 8;
      const eps = 0.18;
      const pts = fromNorth
        ? [
            [0, BH],
            [-eps, 0],
            [-BW, 0],
			[0, -BMID],
            [0, -BH],
            [eps, 0],
            [BW, 0],
            [0, BMID],
            [0, BH],
          ]
        : [
            [0, -BH],
            [eps, 0],
            [BW, 0],
            [0, BMID],
            [0, BH],
            [-eps, 0],
            [-BW, 0],
            [0, -BMID],
            [0, -BH],
          ];
      const i = Math.max(0, Math.min(Math.floor(local + 1e-9), pts.length - 1));
      return pts[i].slice();
    }

    /** Edge mid between ring slots i and i+1 (CCW). Same |offset| outside and inside the edge. */
    function bourreeCornerEdgeMid(edgeSlot, outer) {
      const d = BOURREE_CORNER_LANE;
      // 0 right, 1 top, 2 left, 3 bottom
      if (edgeSlot === 0) return outer ? [BW + d, 0] : [BW - d, 0];
      if (edgeSlot === 1) return outer ? [0, BH + d] : [0, BH - d];
      if (edgeSlot === 2) return outer ? [-BW - d, 0] : [-BW + d, 0];
      return outer ? [0, -BH - d] : [0, -BH + d];
    }

    /**
     * Part 2 corner perimeter: local 0 and 8 = start corner.
     * BR/TL → outer anticlockwise; BL/TR → inner clockwise.
     */
    function bourreeCornerPos(startCornerIndex, local) {
      const startSlot = BOURREE_CORNER_SLOT[startCornerIndex];
      if (startSlot == null) {
        return bourreeCircuit[startCornerIndex].slice();
      }
      const outer = Object.prototype.hasOwnProperty.call(BOURREE_CORNER_OUTER, startCornerIndex);
      const step = Math.max(0, Math.min(Math.floor(local + 1e-9), 8));
      // Even steps = corners; odd = edge mids.
      if (step % 2 === 0) {
        const cornerSteps = step / 2; // 0..4
        const slot = outer
          ? (startSlot + cornerSteps) % 4
          : (startSlot - cornerSteps + 4 * 4) % 4;
        return bourreeCircuit[BOURREE_CORNER_RING[slot]].slice();
      }
      const midSteps = (step - 1) / 2; // 0..3
      const edgeSlot = outer
        ? (startSlot + midSteps) % 4
        : (startSlot - 1 - midSteps + 4 * 4) % 4;
      return bourreeCornerEdgeMid(edgeSlot, outer);
    }

    function bourreePosAt(role, beat) {
      const b = Math.round(beat);
      // Closing frame of the seamless cycle = home start.
      if (b >= BOURREE_CYCLE_END) {
        return bourreeCircuitPos(role, 0);
      }
      const home = bourreeCircuitOffset[role];
      const phrase = Math.floor(b / BOURREE_PHRASE); // 0, 1, 2
      const local = b % BOURREE_PHRASE; // 0..15 within phrase
      // Each completed Part 1 advances 8 circuit steps; Part 2 does not.
      const circuitStart = (home + phrase * BOURREE_PART1_END) % bourreeCircuit.length;
      const part1EndIndex = (circuitStart + BOURREE_PART1_END) % bourreeCircuit.length;

      // Part 1: continue the circuit from wherever the previous Part 2 ended.
      if (local <= BOURREE_PART1_END) {
        return bourreeCircuitPosFrom(circuitStart, local);
      }

      // Part 2: cross on middles; dual-lane perimeter on corners.
      const part2Local = local - BOURREE_PART1_END;
      if (Object.prototype.hasOwnProperty.call(BOURREE_MIDDLE_INDEX, part1EndIndex)) {
        return bourreeCrossPos(part1EndIndex, part2Local);
      }
      if (Object.prototype.hasOwnProperty.call(BOURREE_CORNER_INDEX, part1EndIndex)) {
        return bourreeCornerPos(part1EndIndex, part2Local);
      }
      return bourreeCircuitPosFrom(circuitStart, BOURREE_PART1_END);
    }

    const bourreeFrames = [];
    for (let beat = 0; beat <= BOURREE_CYCLE_END; beat++) {
      // Guide / badge labels: phrase-local 0…16 (home=0, first mid=1; never absolute 17…48).
      const frame = {
        id: String(beat > 0 && beat % BOURREE_PHRASE === 0 ? BOURREE_PHRASE : beat % BOURREE_PHRASE),
        beat,
      };
      BOURREE_ROLES.forEach((role) => {
        frame[role] = bourreePosAt(role, beat);
      });
      bourreeFrames.push(frame);
    }

    function bourreePatternFor(role) {
      return bourreeFrames.map((frame) => frame[role]);
    }

    // Bottom row blue, top row red (facing each other).
    const bourreeDancers = [
      { id: 'BL', color: '#2563eb', label: 'BL', pattern: bourreePatternFor('BL') },
      { id: 'BC', color: '#3b82f6', label: 'BC', pattern: bourreePatternFor('BC') },
      { id: 'BR', color: '#60a5fa', label: 'BR', pattern: bourreePatternFor('BR') },
      { id: 'TR', color: '#dc2626', label: 'TR', pattern: bourreePatternFor('TR') },
      { id: 'TC', color: '#ef4444', label: 'TC', pattern: bourreePatternFor('TC') },
      { id: 'TL', color: '#f87171', label: 'TL', pattern: bourreePatternFor('TL') },
    ];

    // ——— dance registry ———

    const DANCES = {
      san_benito: {
        id: 'san_benito',
        title: 'Porthogese — La fiesta de San Benito',
        bpm: 89,
        stepCount: 4,
        dancers: sanBenitoDancers,
        toCanvas: sanBenitoToCanvas,
        drawBackdrop: sanBenitoBackdrop,
        backdropName: 'Obrys kruhu',
        showStepControls: true,

        hideClosingGuidePoint: false,
        noteHtml:

      },
      congo_de_captieux: {

        showStepControls: true,

        wrapBeats: 0.5,
        baseSpeed: 0.6,
        sections: [
          { fromBeat: 0, toBeat: 2, label: 'Část 1 — Saluto' },
          { fromBeat: 2, toBeat: 4, label: 'Část 1 — Cambio di posto' },
          { fromBeat: 4, toBeat: 6, label: 'Část 2 — Salto' },
          { fromBeat: 6, toBeat: 8, label: 'Část 2 — Papillon' },
          { fromBeat: 8, toBeat: 10, label: 'Část 3 — 1° diagonale' },
          { fromBeat: 10, toBeat: 12, label: 'Část 3 — Tergicristallo' },
          { fromBeat: 12, toBeat: 14, label: 'Část 4 — 2° diagonale' },
          { fromBeat: 14, toBeat: 16, label: 'Část 4 — Spallata a konec' },
        ],
        noteHtml:
          'Vizualizace tance Congo de Captieux (Guascogne) — dvě páry naproti sobě (quadrette), ' +
          'podle popisu a diagramů na ' +
          '<a href="https://ballifolk.altervista.org/congo_de_captieux.html" target="_blank" rel="noopener">ballifolk.altervista.org</a>. ' +
          'Modrá = leadeři (LN/LS), červená = followeři (FN/FS). Pohyb převážně po stranách a úhlopříčkách čtverce. ' +
          '<br/>Vytvořeno zcela pomocí Grok 4.5, doupravil Pavel Hübner v červenci 2026.',
      },
      bourree_6: {
        id: 'bourree_6',
        title: 'Bourrée (6)',
        bpm: 90,

        /** Badge always shows phrase-local /16, not absolute cycle length. */
        badgeTotal: BOURREE_PHRASE,
        timeline: bourreeFrames,
        dancers: bourreeDancers,
        toCanvas: bourreeToCanvas,
        drawBackdrop: bourreeBackdrop,
        backdropName: 'Obrys podlahy',
        showStepControls: true,
        guideLabelsFromZero: true,
        hideClosingGuidePoint: true,
        wrapBeats: 0,
        baseSpeed: 0.65,
        sections: [
          { fromBeat: 0, toBeat: 8, label: 'Část 1 — Obejití' },

          { fromBeat: 16, toBeat: 24, label: 'Část 1 — Obejití' },
          { fromBeat: 24, toBeat: 32, label: 'Část 2 — Kříž / rohy' },
          { fromBeat: 32, toBeat: 40, label: 'Část 1 — Obejití' },
          { fromBeat: 40, toBeat: 48, label: 'Část 2 — Kříž / rohy' },
        ],
        noteHtml:
          'Vizualizace bourrée pro šest tanečníků ve dvou řadách naproti sobě. ' +
          'Nejdřív společně obcházejí obdélník cikcakem přes střed; pak se ti uprostřed křižují ' +
          'a rohové obíhají po obvodu (vnější proti směru hodin, vnitřní po směru) — a pokračují zase odtud, kde skončili. ' +
          'Modrá = spodní řada, červená = horní. ' +
          '<br/>Vytvořeno zcela pomocí Grok 4.5, doupravil Pavel Hübner v červenci 2026.',
      },
    };

    const DANCE_URL_ALIASES = {
      congo: 'congo_de_captieux',
      'la-fiesta': 'san_benito',
      bourree: 'bourree_6',
      'bourree-6': 'bourree_6',
    };
    const DANCE_ID_TO_URL = {
      congo_de_captieux: 'congo',
      san_benito: 'la-fiesta',
      bourree_6: 'bourree',
    };

    function danceFromUrl() {
      const params = new URLSearchParams(location.search);
      for (const key of params.keys()) {
        const id = DANCE_URL_ALIASES[key];
        if (id && DANCES[id]) return DANCES[id];
      }
      return DANCES.san_benito;
    }

    function syncDanceUrl(dance) {
      const alias = DANCE_ID_TO_URL[dance.id];
      if (!alias) return;
      const url = new URL(location.href);
      url.search = '?' + alias;
      history.replaceState(null, '', url);
    }

    // ——— engine ———

    let currentDance = DANCES.san_benito;
    let running = true;
    let elapsedSeconds = 0;
    let lastFrameNow = null;
    // When set, dancers are frozen on pattern[holdFrame] (timeline index).
    let holdFrame = null;
    // One-shot tween between timeline frames (next/back buttons).
    let stepTween = null;
    /** Role id (e.g. BL, LN) or null when showing overlays for all dancers. */
    let selectedDancerId = null;

    function maxHoldFrame(dance) {
      return getTimeline(dance).length - 1;
    }

    function beatDurationSec(dance) {
      return 60 / dance.bpm;
    }

    function frameLabelAt(dance, index) {
      const tl = getTimeline(dance);
      return tl[Math.max(0, Math.min(index, tl.length - 1))].id;
    }

    function positionLabel(dance, state) {
      if (stepTween) {
        return frameLabelAt(dance, stepTween.toFrame);
      }
      if (holdFrame != null) {
        return frameLabelAt(dance, holdFrame);
      }
      return state.frameId;
    }

    function sectionStateFor(dance, state) {
      if (stepTween) {
        const tl = getTimeline(dance);
        return { beatFloat: tl[stepTween.fromFrame].beat };
      }
      if (holdFrame != null) {
        const tl = getTimeline(dance);
        return { beatFloat: tl[holdFrame].beat };
      }
      return state;
    }

    function syncPlayPauseButton() {
      btnPlayPause.textContent = running ? 'Zastavit' : 'Přehrát';
    }

    function syncSpeedButton() {
      btnSpeed.textContent = SPEED_LABELS[speedIndex];
    }

    function uiSpeed() {
      return SPEED_STEPS[speedIndex];
    }

    function effectiveSpeed(dance) {
      const base = dance.baseSpeed != null ? dance.baseSpeed : 1;
      return base * uiSpeed();
    }

    function setStepButtonsEnabled(enabled) {
      btnStepBack.disabled = !enabled;
      btnStepFwd.disabled = !enabled;
    }

    function pauseAtCurrentFrame() {
      const dance = currentDance;
      if (stepTween) {
        holdFrame = stepTween.toFrame;
        stepTween = null;
        setStepButtonsEnabled(true);
      } else {
        const state = getStateAtTime(elapsedSeconds, dance);
        // Land on the frame currently shown (end of transition if waiting, start if mid-move).
        holdFrame = state.moving ? state.stepIndex : state.destIndex;
      }
      running = false;
      syncPlayPauseButton();
    }

    function playFromHold() {
      const dance = currentDance;
      if (stepTween) {
        holdFrame = stepTween.toFrame;
        stepTween = null;
        setStepButtonsEnabled(true);
      }
      const tl = getTimeline(dance);
      const idx = holdFrame == null ? 0 : Math.min(holdFrame, tl.length - 1);
      elapsedSeconds = tl[idx].beat * beatDurationSec(dance);
      holdFrame = null;
      running = true;
      lastFrameNow = null;
      syncPlayPauseButton();
    }

    function stepBy(delta) {
      if (stepTween || running) {
        if (running) pauseAtCurrentFrame();
        if (stepTween) return;
      }
      const dance = currentDance;
      if (holdFrame == null) {
        pauseAtCurrentFrame();
      }

      const max = maxHoldFrame(dance);
      let from = holdFrame;
      let to = (from + delta + (max + 1)) % (max + 1);

      // Skip tween if poses already match (true duplicate frames).
      if (framesPoseEqual(dance, from, to)) {
        holdFrame = to;
        running = false;
        syncPlayPauseButton();
        return;
      }

      // No wrap segment: don't lerp backward across the cycle. Forward wrap
      // snaps to start and continues into the next step so label "1"→"1"→"2"
      // does not consume an extra click; backward wrap snaps only.
      const wrapBeats = getWrapBeats(dance);
      if (wrapBeats === 0 && delta > 0 && from === max && to === 0) {
        from = 0;
        to = 1;
      } else if (wrapBeats === 0 && delta < 0 && from === 0 && to === max) {
        holdFrame = to;
        running = false;
        syncPlayPauseButton();
        return;
      }

      holdFrame = null;
      running = false;
      // Same subdivided move window as continuous play (half-beats split the parent move).
      const moveBeats = subSegmentMoveBeats(dance, from, to);
      const timeline = getTimeline(dance);
      const destIsHalf = isHalfBeatFrame(timeline[to]);
      const group = findGroupForSegment(dance, from, to);
      // Match continuous play: linear for every leg inside a half-beat group.
      const useLinear = destIsHalf || groupHasHalfBeats(group, timeline);
      stepTween = {
        fromFrame: from,
        toFrame: to,
        startMs: performance.now(),
        durationMs: Math.max(0.05, moveBeats) * beatDurationSec(dance) * 1000 / effectiveSpeed(dance),
        destIsHalf,
        useLinear,
      };
      setStepButtonsEnabled(false);
      syncPlayPauseButton();
    }

    function resetClock() {
      elapsedSeconds = 0;
      lastFrameNow = null;
      holdFrame = null;
      stepTween = null;
      running = true;
      setStepButtonsEnabled(true);
      syncPlayPauseButton();
      syncSpeedButton();
    }

    function applyDance(dance) {
      currentDance = dance;
      document.title = dance.title + ' — Pípovo stránky';
      danceNoteBody.innerHTML = dance.noteHtml;
      backdropLabel.textContent = dance.backdropName;
      beatTotalEl.textContent = String(
        dance.badgeTotal != null ? dance.badgeTotal : getCycleBeats(dance)
      );
      playbackControls.classList.toggle('is-visible', !!dance.showStepControls);
      selectedDancerId = null;
      syncDancerPicker(dance);
      resetClock();
    }

    function drawGuidePoints(dance, state) {
      const timeline = getTimeline(dance);
      const lastIdx = timeline.length - 1;
      const hideLast = dance.hideClosingGuidePoint && framesPoseEqual(dance, 0, lastIdx);
      const labelCandidates = [];
      const labelDancers = dancersForOverlays(dance);
      const labelDancerSet = new Set(labelDancers);
      const bourreeRange = dance.id === 'bourree_6'
        ? bourreeOverlayRange(overlayAbsoluteBeat(dance, state))
        : null;

      dance.dancers.forEach((dancer) => {
        const pts = dancer.pattern.map(p => dance.toCanvas(dancer, p));
        pts.forEach((p, idx) => {
          if (hideLast && idx === lastIdx) return;

          ctx.save();
          ctx.fillStyle = dancer.color;
          ctx.globalAlpha = dancerIsDimmed(dancer) ? 0.10 : 0.30;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          if (!toggleLabels.checked || !labelDancerSet.has(dancer)) return;
          if (bourreeRange && !beatInBourreeOverlayWindow(timeline[idx].beat, bourreeRange)) return;
          labelCandidates.push({ id: String(timeline[idx].id), x: p.x, y: p.y });
        });
      });

      if (!toggleLabels.checked || !labelCandidates.length) return;

      // Cluster nearby guide points so reused corners don't stack identical pixels.
      const CLUSTER_PX = 14;
      const clusters = [];
      labelCandidates.forEach((c) => {
        let hit = null;
        for (let i = 0; i < clusters.length; i++) {
          const cl = clusters[i];
          const dx = c.x - cl.x;
          const dy = c.y - cl.y;
          if (dx * dx + dy * dy <= CLUSTER_PX * CLUSTER_PX) {
            hit = cl;
            break;
          }
        }
        if (!hit) {
          clusters.push({ x: c.x, y: c.y, n: 1, ids: new Set([c.id]) });
        } else {
          hit.x = (hit.x * hit.n + c.x) / (hit.n + 1);
          hit.y = (hit.y * hit.n + c.y) / (hit.n + 1);
          hit.n += 1;
          hit.ids.add(c.id);
        }
      });

      ctx.save();
      ctx.fillStyle = '#111827';
      ctx.font = '12px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      clusters.forEach((cl) => {
        const ids = Array.from(cl.ids);
        // Stable order: numeric beat then letter suffix (3 before 3a before 4).
        ids.sort((a, b) => {
          const na = parseFloat(a);
          const nb = parseFloat(b);
          if (na !== nb) return na - nb;
          return a.localeCompare(b);
        });
        ctx.fillText(ids.join(', '), cl.x, cl.y - 14);
      });
      ctx.restore();
    }

    function drawTrails(dance, state) {
      const timeline = getTimeline(dance);
      const dancers = dancersForOverlays(dance);
      let fromIdx = 0;
      let toIdx = timeline.length - 1;
      let wrap = getWrapBeats(dance) > 0 ? 1 : 0;

      if (dance.id === 'bourree_6') {
        // Trails use the full phrase span including the boundary beat (0–16, 16–32,
        // 32–48) so the first segment from 0/16 → 1 is drawn after a phrase ends.
        // Čísla dob still skip the duplicate boundary via beatInBourreeOverlayWindow.
        const range = bourreeOverlayRange(overlayAbsoluteBeat(dance, state));
        wrap = 0;
        fromIdx = -1;
        toIdx = -1;
        for (let i = 0; i < timeline.length; i++) {
          const beat = timeline[i].beat;
          if (beat < range.startBeat || beat > range.endBeat) continue;
          if (fromIdx < 0) fromIdx = i;
          toIdx = i;
        }
        if (fromIdx < 0) return;
      }

      const steps = (toIdx - fromIdx) + wrap;
      if (steps <= 0) return;
      const sampleCount = Math.max(80, steps * 20);

      dancers.forEach((dancer) => {
        ctx.save();
        ctx.strokeStyle = dancer.color;
        ctx.globalAlpha = 0.22;
        ctx.lineWidth = 2;
        ctx.beginPath();

        for (let s = 0; s <= sampleCount; s++) {
          const u = s / sampleCount;
          const total = u * steps;
          const seg = Math.min(steps - 1, Math.floor(total));
          const phase = total - seg;
          const from = fromIdx + Math.min(seg, toIdx - fromIdx);
          const dest = (from === toIdx && wrap) ? fromIdx : Math.min(from + 1, toIdx);
          const p = patternPointAt(dancer.pattern, from, phase, dest);
          const c = dance.toCanvas(dancer, p);
          if (s === 0) ctx.moveTo(c.x, c.y);
          else ctx.lineTo(c.x, c.y);
        }
        ctx.stroke();
        ctx.restore();
      });
    }

    function dancerPoint(dancer, state) {
      if (stepTween) {
        const a = dancer.pattern[stepTween.fromFrame];
        const b = dancer.pattern[stepTween.toFrame];
        return [
          lerp(a[0], b[0], state.localMovePhase),
          lerp(a[1], b[1], state.localMovePhase),
        ];
      }
      if (holdFrame != null) {
        return dancer.pattern[holdFrame];
      }
      if (state.moving) {
        return patternPointAt(
          dancer.pattern, state.stepIndex, state.localMovePhase, state.destIndex
        );
      }
      return dancer.pattern[state.destIndex];
    }

    function drawDancers(dance, state) {
      dance.dancers.forEach((dancer) => {
        const p = dancerPoint(dancer, state);
        const c = dance.toCanvas(dancer, p);
        const dimmed = dancerIsDimmed(dancer);

        ctx.save();
        ctx.globalAlpha = dimmed ? 0.28 : 1;
        ctx.fillStyle = dancer.color;
        ctx.beginPath();
        ctx.arc(c.x, c.y, dotRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(17,24,39,0.18)';
        ctx.stroke();

        if (dancer.label) {
          ctx.fillStyle = '#111827';
          ctx.font = 'bold 11px system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(dancer.label, c.x, c.y - 18);
        }
        ctx.restore();
      });
    }

    function render(state) {
      const dance = currentDance;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (toggleBackdrop.checked) dance.drawBackdrop();
      if (toggleTrails.checked) drawTrails(dance, state);
      if (toggleGuidePoints.checked) drawGuidePoints(dance, state);
      drawDancers(dance, state);

      beatInCycleEl.textContent = String(positionLabel(dance, state));
      sectionLabelEl.textContent = sectionLabelFor(dance, sectionStateFor(dance, state));
    }

    function frame(now) {
      if (stepTween) {
        const u = Math.min(1, (now - stepTween.startMs) / stepTween.durationMs);
        const eased = stepTween.useLinear ? u : easeOutCubic(u);
        const state = {
          beatIndex: stepTween.fromFrame,
          beatInCycle: frameLabelAt(currentDance, stepTween.toFrame),
          frameId: frameLabelAt(currentDance, stepTween.toFrame),
          beatPhase: u * MOVE_FRACTION,
          stepIndex: stepTween.fromFrame,
          destIndex: stepTween.toFrame,
          moving: u < 1,
          localMovePhase: eased,
          beatFloat: getTimeline(currentDance)[stepTween.fromFrame].beat,
          destIsHalf: stepTween.destIsHalf,
        };
        render(state);
        if (u >= 1) {
          holdFrame = stepTween.toFrame;
          stepTween = null;
          setStepButtonsEnabled(true);
        }
        lastFrameNow = now;
        requestAnimationFrame(frame);
        return;
      }

      if (running) {
        if (lastFrameNow != null) {
          elapsedSeconds += ((now - lastFrameNow) / 1000) * effectiveSpeed(currentDance);
        }
      }
      lastFrameNow = now;
      const state = getStateAtTime(elapsedSeconds, currentDance);
      render(state);
      requestAnimationFrame(frame);
    }

    // ——— UI init ———

    Object.values(DANCES).forEach((dance) => {
      const opt = document.createElement('option');
      opt.value = dance.id;
      opt.textContent = dance.title;
      danceSelect.appendChild(opt);
    });

    danceSelect.addEventListener('change', () => {
      const dance = DANCES[danceSelect.value];
      applyDance(dance);
      syncDanceUrl(dance);
    });

    toggleLabels.addEventListener('change', () => {
      if (toggleLabels.checked) toggleGuidePoints.checked = true;
    });

    btnPlayPause.addEventListener('click', () => {
      if (running) {
        pauseAtCurrentFrame();
      } else {
        playFromHold();
      }
    });

    btnStepBack.addEventListener('click', () => stepBy(-1));
    btnStepFwd.addEventListener('click', () => stepBy(1));

    btnSpeed.addEventListener('click', () => {
      speedIndex = (speedIndex + 1) % SPEED_STEPS.length;
      syncSpeedButton();
      // If a step tween is running, scale its remaining duration to the new speed.
      if (stepTween) {
        const u = Math.min(1, (performance.now() - stepTween.startMs) / stepTween.durationMs);
        const dance = currentDance;
        const moveBeats = subSegmentMoveBeats(dance, stepTween.fromFrame, stepTween.toFrame);
        const totalMs = Math.max(0.05, moveBeats) * beatDurationSec(dance) * 1000 / effectiveSpeed(dance);
        stepTween.durationMs = totalMs;
        stepTween.startMs = performance.now() - u * totalMs;
      }
    });

    const initialDance = danceFromUrl();
    danceSelect.value = initialDance.id;
    applyDance(initialDance);
    syncDanceUrl(initialDance);
    requestAnimationFrame(frame);
  </script>
</body>
</html>
